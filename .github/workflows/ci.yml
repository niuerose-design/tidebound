name: CI

# main 푸시와 PR에서만 돕니다(전에는 모든 브랜치 푸시 + PR이라 PR 브랜치는 같은 커밋을 두 번 돌렸음).
# 같은 브랜치·PR에 새 커밋이 오면 앞선 실행은 취소합니다.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Next build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('app/**', 'components/**', 'game/**', 'lib/**', 'hooks/**') }}
          restore-keys: |
            next-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Lint (warnings are errors)
        run: pnpm lint 2>&1 | tee /tmp/lint.log; exit ${PIPESTATUS[0]}
        shell: bash
      - name: Gameplay tests
        run: pnpm test 2>&1 | tee /tmp/test.log; exit ${PIPESTATUS[0]}
        shell: bash
      - name: Build
        run: pnpm build 2>&1 | tee /tmp/build.log; exit ${PIPESTATUS[0]}
        shell: bash
      - name: Type check
        run: pnpm exec tsc --noEmit 2>&1 | tee /tmp/tsc.log; exit ${PIPESTATUS[0]}
        shell: bash
      - name: API end-to-end (local file DB)
        env:
          TIDEBOUND_DEV_DB: /tmp/e2e-db.json
        run: |
          nohup pnpm start --port 3000 > /tmp/start.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/api/auth > /dev/null && break; sleep 2; done
          node scripts/e2e-api.mjs http://localhost:3000 2>&1 | tee /tmp/e2e.log; exit ${PIPESTATUS[0]}
      - name: Publish logs on failure
        if: failure()
        run: |
          mkdir -p /tmp/ci-logs && cp /tmp/*.log /tmp/ci-logs/ 2>/dev/null || true
          cd /tmp/ci-logs && git init -q && git checkout -q -b ci-logs
          git config user.name "github-actions" && git config user.email "actions@github.com"
          echo "source: ${GITHUB_SHA}" > SOURCE.txt && git add -A && git commit -qm "ci logs ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs
